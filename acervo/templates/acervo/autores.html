{% extends 'acervo/base.html' %}

{% block conteudo %}

<h1>Autores</h1>

<form method="get" class="busca">
    <input type="text" name="nome" placeholder="Buscar por nome" value="{{ filtro_nome }}">

    <button type="submit">Buscar</button>
</form>

<a class="botao-novo" href="{% url 'novo_autor' %}">+ Novo autor</a>

<ul>
    {% for autor in autores %}
        <li>
            <div class="card-corpo">
                {% if autor.imagem_url %}
                    <img class="card-imagem" src="{{ autor.imagem_url }}" alt="Foto de {{ autor.nome }}">
                {% endif %}
                <strong>{{ autor.nome }}</strong>
            </div>
            <div class="card-acoes">
                <a href="{% url 'editar_autor' autor.pk %}">Editar</a>
                <a href="{% url 'apagar_autor' autor.pk %}">Apagar</a>
            </div>
        </li>
    {% empty %}
        <li class="vazio">Nenhum autor cadastrado.</li>
    {% endfor %}
</ul>

{% endblock %}
